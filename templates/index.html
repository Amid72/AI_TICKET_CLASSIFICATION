<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Ticket Classifier</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #6366f1;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 560px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.subtitle { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  textarea {
    width: 100%;
    min-height: 100px;
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px;
    font-size: 14px;
    resize: vertical;
  }
  button {
    margin-top: 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #result { margin-top: 24px; display: none; }
  .badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--accent);
    font-weight: 600;
    font-size: 14px;
  }
  .score-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  .error { color: #f87171; font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="card">
    <h1>AI Ticket Classifier</h1>
    <p class="subtitle">Paste a support ticket below and see which category the model predicts.</p>
    <textarea id="ticketText" placeholder="e.g. I was charged twice for my subscription this month"></textarea>
    <br>
    <button id="classifyBtn">Classify Ticket</button>
    <div class="error" id="errorMsg"></div>
    <div id="result">
      <p style="color: var(--muted); font-size: 13px; margin-bottom: 6px;">Predicted category</p>
      <span class="badge" id="categoryBadge"></span>
      <div id="scores" style="margin-top: 18px;"></div>
    </div>
  </div>

<script>
const btn = document.getElementById('classifyBtn');
const textarea = document.getElementById('ticketText');
const resultDiv = document.getElementById('result');
const errorDiv = document.getElementById('errorMsg');
const badge = document.getElementById('categoryBadge');
const scoresDiv = document.getElementById('scores');

btn.addEventListener('click', async () => {
  const text = textarea.value.trim();
  errorDiv.textContent = '';
  resultDiv.style.display = 'none';
  if (!text) {
    errorDiv.textContent = 'Please enter some ticket text.';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Classifying...';
  try {
    const res = await fetch('/api/classify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    if (!res.ok) {
      errorDiv.textContent = data.error || 'Something went wrong.';
      return;
    }
    badge.textContent = data.predicted_category;
    scoresDiv.innerHTML = '';
    if (data.all_scores) {
      Object.entries(data.all_scores)
        .sort((a, b) => b[1] - a[1])
        .forEach(([cls, score]) => {
          const row = document.createElement('div');
          row.className = 'score-row';
          row.innerHTML = `<span>${cls}</span><span>${(score * 100).toFixed(1)}%</span>`;
          scoresDiv.appendChild(row);
        });
    }
    resultDiv.style.display = 'block';
  } catch (err) {
    errorDiv.textContent = 'Request failed. Is the server running?';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Classify Ticket';
  }
});
</script>
</body>
</html>
